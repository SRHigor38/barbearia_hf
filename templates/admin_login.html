<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Admin HF Barbearia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="login-page">
    {% with mensagens = get_flashed_messages(with_categories=True) %}
        {% if mensagens %}
            <div style="position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;width:90%;max-width:400px;">
                {% for categoria, mensagem in mensagens %}
                    <div class="flash-message {{ categoria }}">{{ mensagem }}</div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <div class="login-card">
        <div class="login-icon">🔐</div>
        <h1>Acesso Restrito</h1>
        <p>Faça login para acessar o painel administrativo</p>

        <form method="POST" action="{{ url_for('admin.login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label>Usuário</label>
                <input type="text" class="form-control" name="usuario" placeholder="Digite seu usuário" required>
            </div>
            <div class="mb-3">
                <label>Senha</label>
                <input type="password" class="form-control" name="senha" placeholder="Digite sua senha" required>
            </div>
            <button type="submit" class="btn-gold w-100">
                <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
            </button>
        </form>

        <div class="text-center mt-3">
            <a href="/" class="text-decoration-none" style="color:#666;font-size:13px;">
                <i class="bi bi-arrow-left me-1"></i>Voltar ao site
            </a>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
