<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Plano — HF Barbearia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-hf">
    <div class="container">
        <a class="navbar-brand" href="/">💈 <span>HF</span> Barbearia</a>
        <a href="/" class="btn-outline-gold" style="padding:8px 20px; font-size:13px;">
            <i class="bi bi-arrow-left me-1"></i>Voltar
        </a>
    </div>
</nav>

<!-- Flash Messages -->
{% with mensagens = get_flashed_messages(with_categories=True) %}
    {% if mensagens %}
        <div class="container mt-3">
            {% for categoria, mensagem in mensagens %}
                <div class="flash-message {{ categoria }}">{{ mensagem }}</div>
            {% endfor %}
        </div>
    {% endif %}
{% endwith %}

<!-- Formulário -->
<div class="login-page">
    <div class="login-card">
        <div class="login-icon">
            <i class="bi bi-stars"></i>
        </div>
        <h1>Meu Plano</h1>
        <p>Acesse sua área de cliente</p>

        <form method="POST" action="{{ url_for('main.meu_plano') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label>Telefone</label>
                <input type="tel" class="form-control" name="telefone" placeholder="(11) 99999-8888" required>
            </div>
            <div class="mb-3">
                <label>Código de acesso</label>
                <input type="text" class="form-control" name="codigo" placeholder="Digite seu código" required>
            </div>
            <button type="submit" class="btn-gold w-100">
                <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
            </button>
        </form>

        <div class="text-center mt-3">
            <a href="/" class="text-decoration-none" style="color:#666;font-size:13px;">
                <i class="bi bi-arrow-left me-1"></i>Voltar ao site
            </a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
