# ============================================
# RENDER.YAML - Configuração para o Render
# ============================================
# Este arquivo permite deploy no Render com PostgreSQL
# sem precisar de configuração manual.

services:
  - type: web
    name: hf-barbearia
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.6
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hf-barbearia-db
          property: connectionString
      - key: FLASK_DEBUG
        value: "false"

databases:
  - name: hf-barbearia-db
    plan: free
    databaseName: barbearia