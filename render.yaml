# ============================================
# RENDER.YAML - Configuração para o Render
# ============================================
# Este arquivo permite deploy no Render com PostgreSQL
# sem precisar de configuração manual.
#
# PERSISTÊNCIA DOS DADOS (IMPORTANTE):
#   - Os dados do sistema (agendamentos, clientes, profissionais, serviços,
#     planos, benefícios, financeiro, despesas e configurações) ficam no
#     PostgreSQL gerenciado declarado em "databases" abaixo.
#   - Por isso a variável DATABASE_URL é injetada no Web Service através de
#     "fromDatabase" (connectionString). SEM ela o serviço NÃO sobe:
#     config.py interrompe o start em produção para nunca usar SQLite
#     (o disco do Render Free é efêmero e apagaria os dados no restart/sleep).
#   - Fotos/uploads são arquivos (não são banco de dados) e seguem em static/.

services:
  - type: web
    name: hf-barbearia
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.6
      # SECRET_KEY assina sessões/CSRF. OBRIGATÓRIA em produção:
      # config.py interrompe o start se ela não existir (fail-fast).
      - key: SECRET_KEY
        generateValue: true
      # ADMIN_SENHA_INICIAL: senha do admin criado no primeiro boot.
      # OBRIGATÓRIA em produção: app.py interrompe o start se ela não existir
      # (nunca cria o admin com a senha padrão "admin123").
      # sync: false = o valor NÃO fica no repositório; definir no Dashboard
      # (Web Service > Environment) ANTES do primeiro deploy.
      - key: ADMIN_SENHA_INICIAL
        sync: false
      # PostgreSQL gerenciado -> DATABASE_URL (obrigatória em produção)
      - key: DATABASE_URL
        fromDatabase:
          name: hf-barbearia-db
          property: connectionString
      - key: FLASK_DEBUG
        value: "false"
      # APP_ENV=production: exige PostgreSQL e ativa cookies seguros (HTTPS)
      - key: APP_ENV
        value: "production"

databases:
  - name: hf-barbearia-db
    plan: free
    databaseName: barbearia
